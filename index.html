<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Python Coding Playground - Repository Files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            overflow: hidden;
        }

        header {
            background-color: #21262d;
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #58a6ff;
        }

        .breadcrumb {
            padding: 16px 24px;
            background-color: #0d1117;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb-item {
            color: #58a6ff;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .breadcrumb-item:hover {
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: #8b949e;
        }

        .file-list {
            padding: 0;
        }

        .file-item {
            padding: 12px 24px;
            border-bottom: 1px solid #21262d;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s;
        }

        .file-item:hover {
            background-color: #1c2128;
        }

        .file-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            fill: #8b949e;
        }

        .folder-icon svg {
            fill: #58a6ff;
        }

        .file-name {
            color: #58a6ff;
            font-size: 14px;
            font-weight: 500;
        }

        .folder-name {
            color: #58a6ff;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .back-button {
            margin: 16px 24px;
            padding: 8px 16px;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background-color: #30363d;
        }

        footer {
            padding: 16px 24px;
            text-align: center;
            color: #8b949e;
            font-size: 12px;
            border-top: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

        </header>

        <div class="breadcrumb">
            <span class="breadcrumb-item" id="rootBreadcrumb">Repository</span>
            <span class="breadcrumb-separator hidden" id="separator">/</span>
            <span class="breadcrumb-item hidden" id="folderBreadcrumb"></span>

            <span>←</span>

    <script>
        let currentView = 'root';

        function openFolder(folderName) {
            if (folderName === 'Mocks') {
                currentView = 'mocks';
                document.getElementById('rootView').classList.add('hidden');
                document.getElementById('mocksView').classList.remove('hidden');
                document.getElementById('backButton').classList.remove('hidden');
                document.getElementById('separator').classList.remove('hidden');
                document.getElementById('folderBreadcrumb').classList.remove('hidden');
                document.getElementById('folderBreadcrumb').textContent = 'Mocks';
            }
        }

        function goBack() {
            currentView = 'root';
            document.getElementById('rootView').classList.remove('hidden');
            document.getElementById('mocksView').classList.add('hidden');
            document.getElementById('backButton').classList.add('hidden');
            document.getElementById('separator').classList.add('hidden');
            document.getElementById('folderBreadcrumb').classList.add('hidden');
        }

        function openFile(fileName) {
            // Open the file in GitHub
            const repoUrl = 'https://github.com/MrZisidis/IB-python-coding-playground/blob/main/';
            window.open(repoUrl + fileName, '_blank');
        }

        // Set up back button
        document.getElementById('backButton').addEventListener('click', goBack);
        document.getElementById('rootBreadcrumb').addEventListener('click', goBack);
    </script>
</body>
</html>
